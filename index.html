<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<title>Chats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
 background:#fff;--ink:#0d0f12;--ink2:#6a707a;--ink3:#a2a8b2;--line:#eceef1;--acc:#0b7d5c;--sel:#f4f5f7;--surf:#fff;
 color:var(--ink);overflow:hidden}
@media (prefers-color-scheme: dark){
 body{background:#0b0c0e;--ink:#eef1f4;--ink2:#949aa4;--ink3:#666c76;--line:#1b1e23;--acc:#2bd49a;--sel:#15181c;--surf:#0b0c0e}}
.app{position:fixed;inset:0;overflow:hidden}

/* cabecera + panel: una sola pieza que se mueve junta */
.top{position:absolute;left:0;right:0;top:0;z-index:4;background:var(--surf);will-change:transform;
 padding-top:env(safe-area-inset-top)}
.hdr{height:48px;display:flex;align-items:center;padding:0 16px}
.hdr h2{font-size:23px;font-weight:700;letter-spacing:-.038em}
.reveal{height:0;overflow:hidden;background:var(--sel)}
.reveal .inner{padding:8px 13px 10px;opacity:0}
.fld{height:40px;border-radius:20px;background:var(--surf);display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--ink3);font-size:13.5px;box-shadow:0 1px 2px rgba(13,15,18,.08)}
.fld [data-lucide]{width:16px;height:16px}
.chips{display:flex;gap:6px;margin-top:7px;overflow:hidden}
.chips span{height:30px;padding:0 13px;border-radius:15px;background:var(--surf);color:var(--ink2);font-size:12px;font-weight:570;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 1px 2px rgba(13,15,18,.06)}
.chips span.on{background:var(--acc);color:#fff;font-weight:660;box-shadow:none}
.chips b{font-size:10.5px;opacity:.75;font-weight:700}
.hairline{height:1px;background:var(--line)}
.puller{position:absolute;left:50%;top:0;transform:translateX(-50%);width:40px;height:40px;display:grid;place-items:center;opacity:0;pointer-events:none}
.puller svg.ring{position:absolute;inset:0;width:40px;height:40px;transform:rotate(-90deg)}
.puller .track{fill:none;stroke:var(--line);stroke-width:2.5}
.puller .bar{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;transition:none}
.puller .glass{color:var(--ink2);display:grid;place-items:center}
.puller .glass [data-lucide]{width:17px;height:17px;stroke-width:2.2}
.puller.ready .glass{color:var(--acc)}
.chips span{cursor:pointer;user-select:none;transition:background .16s,color .16s}
.chips span:active{transform:scale(.97)}
.tb{cursor:pointer;user-select:none}
.av.ring{box-shadow:0 0 0 2px var(--surf),0 0 0 3.5px var(--acc)}
.av [data-lucide]{width:19px;height:19px;color:var(--ink2)}
.n.miss{color:#d9544d}
.call{display:grid;place-items:center;flex:none}
.call [data-lucide]{width:13px;height:13px}
.call.in{color:var(--acc)}.call.out{color:var(--ink3)}.call.miss{color:#d9544d}
.cta{width:34px;height:34px;border-radius:17px;background:var(--sel);display:grid;place-items:center;color:var(--acc)}
.cta [data-lucide]{width:17px;height:17px}
.ic [data-lucide]{width:14px;height:14px}
.masonry{column-count:2;column-gap:9px;padding:9px 12px 0}
.card{position:relative;break-inside:avoid;margin:0 0 9px;border-radius:20px;overflow:hidden;display:block;
 background:var(--sel);box-shadow:0 1px 3px rgba(13,15,18,.1)}
.card .capa{position:absolute;inset:0;opacity:0;display:grid;place-items:center;padding:16px}
.card .capa.on{opacity:1}
.card .frase{color:#fff;font-size:16px;font-weight:650;letter-spacing:-.02em;text-align:center;line-height:1.3;
 text-shadow:0 1px 10px rgba(0,0,0,.25)}
.card .avr{position:relative;width:40px;height:40px;display:grid;place-items:center;flex:none}
.card .avr .anillo{position:absolute;inset:0;width:40px;height:40px;overflow:visible}
.card .avr .anillo circle{fill:none;stroke-width:2.4;stroke-linecap:round;transform-origin:50% 50%}
.card .avr .trk{stroke:rgba(255,255,255,.34)}
.card .avr .fil{stroke:#fff}
.card.visto .avr .fil{stroke:rgba(255,255,255,.62)}
.card .pie{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 11px;display:flex;align-items:center;gap:8px;z-index:2;
 background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0))}
.card .pie .av{width:30px;height:30px;font-size:11px;box-shadow:none}

.card .meta{min-width:0;display:flex;flex-direction:column;gap:1px}
.card .meta b{font-size:12.5px;font-weight:650;color:#fff;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta small{font-size:10.5px;color:rgba(255,255,255,.75)}
.card.add{display:grid;place-items:center;align-content:center;gap:7px;background:var(--sel);
 box-shadow:inset 0 0 0 1.5px var(--line)}
.card.add .plus{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#fff;display:grid;place-items:center}
.card.add .plus [data-lucide]{width:21px;height:21px}
.card.add b{font-size:13px;font-weight:650;color:var(--ink)}
.card.add small{font-size:11px;color:var(--ink3)}
.g1{background:linear-gradient(145deg,#6f8f6a,#3f6b58)}
.g2{background:linear-gradient(145deg,#b9798f,#7e4a6b)}
.g3{background:linear-gradient(145deg,#7d8bb8,#4a5684)}
.g4{background:linear-gradient(145deg,#c79a63,#8c6236)}
.g5{background:linear-gradient(145deg,#6aa0b5,#3a6b84)}
.g6{background:linear-gradient(145deg,#9b86bd,#5f4e8c)}
.g7{background:linear-gradient(145deg,#c68b7a,#8c5346)}
.g8{background:linear-gradient(145deg,#6fae9a,#3b7d6c)}
.visor{position:fixed;inset:0;z-index:20;background:#000;opacity:0;visibility:hidden;overflow:hidden}
.visor.on{opacity:1;visibility:visible}
.vmedia{position:absolute;inset:0}
.vmedia .capa{position:absolute;inset:0;opacity:0;display:grid;place-items:center;padding:32px}
.vmedia .capa.on{opacity:1}
.vmedia .frase{color:#fff;font-size:27px;font-weight:700;letter-spacing:-.03em;text-align:center;line-height:1.25;
 text-shadow:0 2px 20px rgba(0,0,0,.3)}
.vtop{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;
 display:flex;align-items:center;gap:11px;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent)}
.vtop .avr{width:46px;height:46px}
.vtop .avr .anillo{width:46px;height:46px}
.vtop .avr .av{width:36px;height:36px;font-size:13px}
.vtop .vmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vtop .vmeta b{font-size:15px;font-weight:650;color:#fff;letter-spacing:-.02em}
.vtop .vmeta small{font-size:11.5px;color:rgba(255,255,255,.7)}
.vtop .vx{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14)}
.vtop .vx [data-lucide]{width:19px;height:19px}
.vzonas{position:absolute;inset:0;z-index:2;display:flex}
.vzonas span{flex:1}
.vbot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 14px calc(16px + env(safe-area-inset-bottom));
 display:flex;align-items:center;gap:9px;background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}
.vbot .vfld{flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);
 display:flex;align-items:center;padding:0 16px;color:rgba(255,255,255,.8);font-size:14px}
.vbot .vbtn{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#fff;display:grid;place-items:center}
.vbot .vbtn [data-lucide]{width:19px;height:19px}
.card{cursor:pointer}
.empty{padding:56px 24px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty b{display:block;color:var(--ink2);font-weight:600;font-size:14.5px;margin-bottom:4px}

.list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surf);
 padding-bottom:calc(92px + env(safe-area-inset-bottom));scrollbar-width:none;z-index:3}
.list::-webkit-scrollbar{display:none}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center;padding:8px 16px;position:relative;background:var(--surf)}
.row:active{background:var(--sel)}
.row+.row::after{content:"";position:absolute;left:71px;right:0;top:0;height:1px;background:var(--line)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:630;position:relative}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#19c37d;box-shadow:0 0 0 2.2px var(--surf)}
.col{min-width:0;display:flex;flex-direction:column;gap:2px}
.n{font-size:14.5px;font-weight:570;letter-spacing:-.02em;display:flex;gap:5px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n em{font-style:normal;font-size:10.5px;color:var(--ink3)}
.p{font-size:12.8px;color:var(--ink2);letter-spacing:-.014em;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un .n{font-weight:730}.un .p{color:var(--ink)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.t{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.t.hot{color:var(--acc);font-weight:660}
.cnt{min-width:18px;height:18px;padding:0 5.5px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:720;display:grid;place-items:center}
.cnt.gy{background:var(--ink3)}
.tk{display:grid;place-items:center;color:var(--ink3)}.tk.read{color:var(--acc)}
.tk [data-lucide]{width:14px;height:14px;stroke-width:2.4}
.ic{color:var(--ink3);display:grid;place-items:center}.ic [data-lucide]{width:13px;height:13px}
.wv{display:flex;align-items:center;gap:1.7px;height:12px;flex:none}
.wv i{width:2.2px;border-radius:1.2px;background:var(--acc);display:block;opacity:.8}
.typ{color:#19c37d;font-weight:570;display:flex;align-items:center}
.typ b{display:inline-flex;gap:2.5px;margin-left:4px}
.typ b i{width:3.5px;height:3.5px;border-radius:50%;background:#19c37d;display:block;opacity:.45}
.typ b i:nth-child(2){opacity:.75}.typ b i:nth-child(3){opacity:1}
.dr{color:#c2410c;font-weight:590}
.ph{width:26px;height:26px;border-radius:9px;flex:none;display:block}
.at{width:17px;height:17px;border-radius:50%;background:var(--acc);color:#fff;font-size:10.5px;font-weight:760;display:grid;place-items:center;flex:none}
.tabs{display:flex;align-items:center;gap:0;will-change:transform}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));contain:layout;backface-visibility:hidden;z-index:6;display:flex;align-items:center;gap:2px;padding:5px;border-radius:26px;
 background:rgba(255,255,255,.9);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
 box-shadow:0 0 0 1px rgba(13,15,18,.1),0 12px 28px rgba(0,0,0,.16)}
@media (prefers-color-scheme: dark){.dock{background:rgba(22,25,30,.88);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 14px 30px rgba(0,0,0,.6)}}
.tb{height:42px;min-width:46px;padding:0 13px;border-radius:21px;display:flex;align-items:center;justify-content:center;gap:0;color:var(--ink2);position:relative}
.tb em{font-style:normal;font-size:12.5px;font-weight:660;letter-spacing:-.015em;
 display:inline-block;overflow:hidden;white-space:nowrap;width:0;opacity:0;
 padding-left:7px;box-sizing:content-box}
.dock{will-change:transform}
.tb.on{background:#e9f3ef;color:var(--acc)}
@media (prefers-color-scheme: dark){.tb.on{background:#15271f}}
.tb [data-lucide]{width:20px;height:20px}
.tb .rd{position:absolute;top:9px;right:11px;width:6px;height:6px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.me{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:660;color:#fff}
.c1{background:#5b8c51}.c2{background:#b05a7a}.c3{background:#6f5bb0}.c4{background:#b07a3c}
.c5{background:#3f7fa8}.c6{background:#2f8d7a}.c7{background:#a8553f}.c8{background:#55657f}.c9{background:#8a7a3f}
</style></head><body>

</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const wave='<span class="wv">'+[5,8,12,7,11,5,10,4,8,12,6,9,5,8,10,6].map(h=>`<i style="height:${h}px"></i>`).join('')+'</span>';
const tk2='<span class="tk read"><i data-lucide="check-check"></i></span>';
const tk1='<span class="tk"><i data-lucide="check"></i></span>';
const base=[
 {n:'Ismael Moreno',p:wave+'Nota de voz · 0:42',t:'14:07',un:3,av:'c1',m:'IM',on:1},

 {n:'Daniel Cortés',p:'<span class="dr">Borrador:</span> Te mando el reporte',t:'11:20',av:'c8',m:'DC'},
 {n:'Beto',p:tk2+'Va, nos vemos',t:'16:11',av:'c1',m:'B'},
 {n:'Mamá',p:'Llámame cuando puedas',t:'jue',av:'c4',m:'M',pin:1},
 {n:'Vecinos Torre B',tag:'grupo',p:'Se corta el agua mañana',t:'mar',un:12,gy:1,av:'c3',m:'VT'},
 {n:'Carlos',p:tk1+'Mai, ¿cómo vas?',t:'lun',av:'c8',m:'C'},
 {n:'Isma',p:tk2+'Va, lo reviso',t:'lun',av:'c6',m:'I'},

 {n:'Vero',p:tk2+'jajaja ok',t:'vie',av:'c7',m:'V'},

 {n:'Cassie',p:'¿Viste el reporte?',t:'jue',av:'c2',m:'CB'},
 {n:'Emmanuel',p:tk2+'QA pasado',t:'mié',av:'c6',m:'EL'},
 {n:'Renta Torre',tag:'grupo',p:'Recordatorio de pago',t:'mar',av:'c8',m:'RT',mute:1},
];
lucide.createIcons({attrs:{'stroke-width':2}});

const list=document.getElementById('list'),bar=document.getElementById('top'),
      reveal=document.getElementById('reveal'),inner=document.getElementById('inner'),
      puller=document.getElementById('puller'),ringbar=document.getElementById('ringbar'),
      chipEls=[...document.getElementById('chipsrow').children],
      tabEls=[...document.querySelectorAll('.dock .tb')];
const FULL=96, C=110;
let screen='chats';                       // alto del panel y perímetro del aro

const estados=[
 {n:'Tu estado',t:'Añade una actualización',av:'c7',m:'J',add:1,h:150},

 {n:'Mamá',t:'ayer',av:'c4',m:'M',h:200,piezas:[{g:'g3',txt:'el jardín quedó listo'},{g:'g5'}]},
];

 {n:'Esposita',k:'in',t:'hoy 13:02',d:'12 min',av:'c2',m:'E',video:1},
 {n:'Ismael Moreno',k:'miss',t:'hoy 11:40',d:'perdida',av:'c1',m:'IM'},
 {n:'Mamá',k:'out',t:'ayer 20:15',d:'34 min',av:'c4',m:'M'},
 {n:'Daniel Cortés',k:'in',t:'ayer 17:05',d:'4 min',av:'c8',m:'DC'},
 {n:'Hotdogs del Centro',k:'out',t:'lun 19:30',d:'grupo · 8 min',av:'c3',m:'HC',video:1},
 {n:'Carlos',k:'miss',t:'dom 09:12',d:'perdida',av:'c8',m:'C'},
 {n:'Beto',k:'out',t:'sáb 22:40',d:'1 h 05',av:'c1',m:'B'},
];
const RC=2*Math.PI*17.5;                       // perímetro del anillo
function anillo(n){
  const gap = n>1 ? 6 : 0, seg = RC/n - gap;
  let out = '<svg class="anillo" viewBox="0 0 40 40">';
  for(let i=0;i<n;i++){
    const rot = -90 + i*360/n + (gap/2/RC)*360;
    out += `<circle class="trk" cx="20" cy="20" r="17.5" stroke-dasharray="${seg} ${RC}" style="transform:rotate(${rot}deg)"/>`
         + `<circle class="fil" cx="20" cy="20" r="17.5" stroke-dasharray="0 ${RC}" data-seg="${seg}" style="transform:rotate(${rot}deg)"/>`;
  }
  return out + '</svg>';
}
let ciclos=[];
function pararCiclos(){ ciclos.forEach(c=>clearInterval(c)); ciclos=[]; }
function paintEstados(){
  pararCiclos();
  list.innerHTML = '<div class="masonry">' + estados.map((d,idx)=>{
    if(d.add) return `<article class="card add" style="height:${d.h}px">
        <span class="plus"><i data-lucide="plus"></i></span>
        <b>Tu estado</b><small>${d.t}</small></article>`;
    const n=d.piezas.length;
    const capas=d.piezas.map((p,i)=>`<span class="capa ${p.g}${i?'':' on'}">${
        p.txt?`<span class="frase">${p.txt}</span>`:''}</span>`).join('');
    return `<article class="card${d.nuevo?'':' visto'}" data-i="${idx}" data-n="${n}" style="height:${d.h}px">
      ${capas}
      <span class="pie">
        <span class="avr">${anillo(n)}<span class="av ${d.av}">${d.m}</span></span>
        <span class="meta"><b>${d.n}</b><small>${d.t}${n>1?' · '+n:''}</small></span>
      </span></article>`;
  }).join('') + '</div>';
  lucide.createIcons({attrs:{'stroke-width':2}});
  // cada tarjeta con varias piezas rota sola, desfasada para que no vayan al unísono
  list.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
    const i=+c.dataset.i; if(!isNaN(i)) abrirVisor(i,c);
  }));
  list.querySelectorAll('.card[data-n]').forEach((card,k)=>{
    const n=+card.dataset.n;
    const capas=[...card.querySelectorAll('.capa')], fills=[...card.querySelectorAll('.fil')];
    const D = 2600 + k*420;                        // lo que dura cada pieza
    const vaciar=i=>fills[i].setAttribute('stroke-dasharray','0 '+RC);
    const llenar=i=>{ const seg=+fills[i].dataset.seg, o={v:0};
      gsap.to(o,{v:seg,duration:D/1000,ease:'none',
        onUpdate(){ fills[i].setAttribute('stroke-dasharray', o.v+' '+RC); }}); };
    let a=0; llenar(0);
    ciclos.push(setInterval(()=>{
      const sig=(a+1)%n;
      if(n>1){
        gsap.to(capas[a],{opacity:0,duration:.5,ease:'power2.inOut'});
        gsap.fromTo(capas[sig],{opacity:0,scale:1.04},{opacity:1,scale:1,duration:.6,ease:'power2.out'});
      }
      if(sig===0) fills.forEach((_,i)=>vaciar(i));
      llenar(sig); a=sig;
    }, D));
  });
}
/* ---------- visor de estados ---------- */
const visor=document.getElementById('visor'), vmedia=document.getElementById('vmedia'),
      vanillo=document.getElementById('vanillo'), vnombre=document.getElementById('vnombre'),
      vtiempo=document.getElementById('vtiempo');
let vIdx=0, vPieza=0, vTween=null, vPausa=false;
const VD=4;                                     // segundos por pieza

function pintarVisor(){
  const d=estados[vIdx], n=d.piezas.length;
  vmedia.innerHTML=d.piezas.map((p,i)=>`<span class="capa ${p.g}${i===vPieza?' on':''}">${
    p.txt?`<span class="frase">${p.txt}</span>`:''}</span>`).join('');
  vanillo.innerHTML=anillo(n)+`<span class="av ${d.av}">${d.m}</span>`;
  vnombre.textContent=d.n; vtiempo.textContent=d.t+(n>1?` · ${vPieza+1} de ${n}`:'');
  const fills=[...vanillo.querySelectorAll('.fil')];
  fills.forEach((f,i)=>f.setAttribute('stroke-dasharray',(i<vPieza?+f.dataset.seg:0)+' '+RC));
  if(vTween) vTween.kill();
  const f=fills[vPieza], seg=+f.dataset.seg, o={v:0};
  vTween=gsap.to(o,{v:seg,duration:VD,ease:'none',
    onUpdate(){ f.setAttribute('stroke-dasharray',o.v+' '+RC); },
    onComplete(){ avanzar(1); }});
}
function avanzar(paso){
  const n=estados[vIdx].piezas.length;
  if(vPieza+paso<0){ if(vIdx>0){ vIdx--; vPieza=estados[vIdx].piezas.length-1; pintarVisor(); } return; }
  if(vPieza+paso>=n){
    let sig=vIdx+1; while(sig<estados.length && estados[sig].add) sig++;
    if(sig>=estados.length) return cerrarVisor();
    vIdx=sig; vPieza=0; return pintarVisor();
  }
  vPieza+=paso; pintarVisor();
}
function abrirVisor(idx,origen){
  if(estados[idx].add) return;
  vIdx=idx; vPieza=0; visor.classList.add('on');
  pintarVisor();
  const r=origen.getBoundingClientRect();
  gsap.fromTo(visor,{opacity:0},{opacity:1,duration:.22,ease:'power2.out'});
  gsap.fromTo(vmedia,{scale:.72,x:r.left+r.width/2-innerWidth/2,y:r.top+r.height/2-innerHeight/2,borderRadius:20},
    {scale:1,x:0,y:0,borderRadius:0,duration:.44,ease:'power3.out'});
  pararCiclos();
}
function cerrarVisor(){
  if(vTween) vTween.kill();
  gsap.to(visor,{opacity:0,duration:.2,ease:'power2.in',
    onComplete(){ visor.classList.remove('on'); if(screen==='estados') paintEstados(); }});
}
document.getElementById('vcerrar').addEventListener('click',cerrarVisor);
document.getElementById('zDer').addEventListener('click',()=>avanzar(1));
document.getElementById('zIzq').addEventListener('click',()=>avanzar(-1));
['pointerdown','pointerup','pointercancel'].forEach(ev=>
  visor.addEventListener(ev,e=>{
    if(e.target.closest('.vtop,.vbot'))return;
    const pausar=ev==='pointerdown';
    if(vTween){ pausar?vTween.pause():vTween.resume(); }
  }));
let vY=null;
visor.addEventListener('touchstart',e=>{vY=e.touches[0].clientY;},{passive:true});
visor.addEventListener('touchend',e=>{
  if(vY!==null && e.changedTouches[0].clientY-vY>70) cerrarVisor();
  vY=null;
},{passive:true});

function paintLlamadas(){
  const ico={in:'arrow-down-left',out:'arrow-up-right',miss:'phone-missed'};
  list.innerHTML = llamadas.map(d=>`
   <div class="row">
     <span class="av ${d.av}">${d.m}</span>
     <span class="col"><span class="n${d.k==='miss'?' miss':''}">${d.n}</span>
       <span class="p"><span class="call ${d.k}"><i data-lucide="${ico[d.k]}"></i></span>${d.t} · ${d.d}</span></span>
     <span class="rt"><span class="cta"><i data-lucide="${d.video?'video':'phone'}"></i></span></span>
   </div>`).join('');
}
function paint(){
  if(screen!=='estados') pararCiclos();
  if(screen==='estados'){ paintEstados(); lucide.createIcons({attrs:{'stroke-width':2}}); syncPad(); return; }
  if(screen==='llamadas'){ paintLlamadas(); lucide.createIcons({attrs:{'stroke-width':2}}); syncPad(); return; }
  const f=filter;
  const rows=base.filter(d=>
    f==='No leídos' ? !!d.un :
    f==='Grupos'    ? d.tag==='grupo' :
    f==='Favoritos' ? !!d.pin : true);
  list.innerHTML = rows.length ? rows.map(d=>`
   <div class="row${d.un?' un':''}">
     <span class="av ${d.av}">${d.m}${d.on?'<i class="dot"></i>':''}</span>
     <span class="col"><span class="n">${d.n}${d.tag?` <em>${d.tag}</em>`:''}</span><span class="p">${d.p}</span></span>
     <span class="rt"><span class="t${d.un?' hot':''}">${d.t}</span>${
       d.un?`<span class="cnt${d.gy?' gy':''}">${d.un}</span>`
       : d.pin?'<span class="ic"><i data-lucide="pin"></i></span>'
       : d.mute?'<span class="ic"><i data-lucide="bell-off"></i></span>':''}</span>
   </div>`).join('')
   : `<div class="empty"><b>Nada por aquí</b>No hay conversaciones en ${f.toLowerCase()}</div>`;
  lucide.createIcons({attrs:{'stroke-width':2}});
  syncPad();
}
chipEls.forEach(el=>el.addEventListener('click',()=>{
  chipEls.forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  filter=el.textContent.replace(/[0-9]+$/,'').trim();
  paint();
  gsap.fromTo(list,{opacity:.35,y:6},{opacity:1,y:0,duration:.26,ease:'power2.out'});
}));
const titulos={chats:'Chats',estados:'Estados',llamadas:'Llamadas',perfil:'Tú'};
/* ancho natural de cada etiqueta, medido una vez */
const dock=document.querySelector('.dock');
gsap.set(dock,{xPercent:-50,force3D:true});
const labels=tabEls.map(t=>t.querySelector('em'));
const anchos=labels.map(em=>{ em.style.width='auto'; const w=Math.round(em.scrollWidth); em.style.width='0px'; return w; });
labels[0].style.width=anchos[0]+'px'; labels[0].style.opacity=1;

const tabsWrap=document.querySelector('.tabs');
function moverEtiqueta(i){
  /* FLIP: un solo reflow para fijar el ancho final y luego solo transform,
     que corre en GPU. Nada de animar layout cuadro a cuadro. */
  const w0=dock.getBoundingClientRect().width;
  labels.forEach((em,j)=>{ em.style.width=(j===i?anchos[j]:0)+'px'; });   // reflow único
  const w1=dock.getBoundingClientRect().width;
  const D=.42, E='power3.out';
  gsap.killTweensOf([dock,tabsWrap]);
  gsap.fromTo(dock,{scaleX:w0/w1},{scaleX:1,duration:D,ease:E,force3D:true,overwrite:'auto'});
  gsap.fromTo(tabsWrap,{scaleX:w1/w0},{scaleX:1,duration:D,ease:E,force3D:true,overwrite:'auto'});
  labels.forEach((em,j)=>gsap.to(em,{opacity:j===i?1:0,duration:j===i?.3:.18,
     delay:j===i?.1:0,ease:'power2.out',overwrite:'auto'}));
}
tabEls.forEach((el,i)=>el.addEventListener('click',()=>{
  if(el.classList.contains('on'))return;
  tabEls.forEach(t=>t.classList.remove('on')); el.classList.add('on');
  moverEtiqueta(i);
  gsap.fromTo(el.querySelector('[data-lucide],.me'),{scale:.84},{scale:1,duration:.34,ease:'back.out(1.7)'});
  screen=['chats','estados','llamadas','perfil'][i];
  document.querySelector('.hdr h2').textContent=titulos[screen];
  document.getElementById('chipsrow').style.display = screen==='chats'?'flex':'none';
  if(locked) collapse();
  list.scrollTop=0;
  paint();
  gsap.fromTo(list,{opacity:0,y:10},{opacity:1,y:0,duration:.3,ease:'power2.out'});
}));
paint();

function render(h){
  reveal.style.height=h+'px';
  const k=Math.min(1,h/FULL);
  inner.style.opacity=Math.max(0,(k-.45)/.55);
  inner.style.transform='translateY('+((1-k)*6)+'px)';
  // indicador: aro que se llena, lupa que gira al completarse
  const p=Math.min(1,h/FULL);
  puller.style.opacity = locked ? 0 : Math.min(1, h/18) * (1-Math.max(0,(k-.55)/.45));
  puller.style.top = Math.max(0,(h-40)/2)+'px';
  ringbar.setAttribute('stroke-dashoffset', C*(1-p));
  puller.classList.toggle('ready', p>=1);
  puller.style.transform='translateX(-50%) rotate('+(p*180)+'deg) scale('+(0.8+p*0.2)+')';
  syncPad();
}
render(0); syncPad();

function settle(open){
  animating=true;locked=open;
  gsap.to({v:parseFloat(reveal.style.height)||0},{v:open?FULL:0,duration:open?.42:.3,
   ease:open?'back.out(1.5)':'power3.inOut',
   onUpdate(){render(this.targets()[0].v)},
   onComplete(){animating=false;
     if(open){ puller.style.opacity=0;
       gsap.fromTo(chipEls,{y:8,opacity:0},{y:0,opacity:1,duration:.3,stagger:.05,ease:'power2.out'});}}});
}
function collapse(){ if(locked||drag>0){drag=0;settle(false);} }
function hideHdr(){ if(hidden||locked||drag>0)return;hidden=true;gsap.to(bar,{yPercent:-100,duration:.3,ease:'power3.inOut'}); }
function showHdr(){ if(!hidden)return;hidden=false;gsap.to(bar,{yPercent:0,duration:.26,ease:'power3.out'}); }

list.addEventListener('scroll',()=>{
  const y=list.scrollTop,d=y-lastY;
  atTop = y<=2;
  if(y<50)showHdr(); else if(d>1.2)hideHdr(); else if(d<-0.5)showHdr();
  lastY=y;
},{passive:true});

/* resistencia: cuesta más conforme avanzas */
function pull(dy){
  if(animating||!atTop||screen!=='chats')return;
  const prog=Math.min(1,drag/FULL);
  const resist=0.52*(1-prog*0.62);            // 0.52 al inicio, ~0.20 al final
  drag=Math.max(0,Math.min(FULL*1.08,drag+dy*resist));
  locked=false; render(Math.min(FULL,drag));
}
function release(){
  if(animating)return;
  const h=parseFloat(reveal.style.height)||0;
  if(h>=FULL*0.92){ settle(true); drag=FULL; }
  else if(h>0){ settle(false); drag=0; }
  else { drag=0; locked=false; }
}
let ty=null,startTop=false;
function curH(){ return parseFloat(reveal.style.height)||0; }

list.addEventListener('touchstart',e=>{
  ty=e.touches[0].clientY; startTop=list.scrollTop<=2; drag=locked?FULL:0;
},{passive:true});

/* no pasivo: cuando el panel está abierto nos comemos el scroll hasta cerrarlo */
list.addEventListener('touchmove',e=>{
  if(ty===null)return;
  const y=e.touches[0].clientY, dy=y-ty; ty=y;
  const h=curH();
  if(animating)return;

  if(h>0 && dy<0 && list.scrollTop<=0){        // cerrando: sigue al dedo
    e.preventDefault();
    drag=Math.max(0,Math.min(FULL,h+dy));
    locked=false;
    render(drag);
    if(drag===0){ puller.style.opacity=0; }
    return;
  }
  if(dy>0 && startTop && h<FULL){              // abriendo: con resistencia
    showHdr(); pull(dy);
    if(curH()>0) e.preventDefault();
  }
},{passive:false});

list.addEventListener('touchend',()=>{
  ty=null;
  const h=curH();
  if(h>0 && h<FULL){ drag=h; release(); }      // decide abrir o cerrar
  else if(h===0){ drag=0; locked=false; }
  else { locked=true; drag=FULL; }
},{passive:true});
list.addEventListener('touchcancel',()=>{ty=null;release();},{passive:true});

let lw=0,wheelTop=false;
list.addEventListener('wheel',e=>{
  const now=Date.now(), h=curH();
  if(now-lw>140){wheelTop=list.scrollTop<=2;drag=h;}
  lw=now;
  if(h>0 && e.deltaY>0 && list.scrollTop<=0){   // cerrar comiéndose el scroll
    e.preventDefault();
    drag=Math.max(0,Math.min(FULL,h-e.deltaY*0.6));
    locked=false; render(drag);
    clearTimeout(window._t); window._t=setTimeout(()=>{ if(drag>0&&drag<FULL) release(); },140);
    return;
  }
  if(e.deltaY<0){ showHdr();
    if(wheelTop&&!locked){ pull(-e.deltaY*.55); clearTimeout(window._t); window._t=setTimeout(release,140);} }
},{passive:false});

window.addEventListener('resize',syncPad);
</script>
</body></html>
